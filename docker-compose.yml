services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coffee_ledger
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: coffee
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee -d coffee_ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://coffee:coffee@postgres:5432/coffee_ledger?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: .
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
